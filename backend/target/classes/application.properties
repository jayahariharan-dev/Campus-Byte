# --- Server ---
server.port=8080

# --- PostgreSQL connection ---
# Create this database first: CREATE DATABASE campusbyte;
spring.datasource.url=jdbc:postgresql://localhost:5432/campusbyte
spring.datasource.username=postgres
spring.datasource.password=admin123

# --- JPA / Hibernate ---
# 'update' = Hibernate auto-creates/updates tables from your entities.
# Good for development. We'll switch to migrations later if needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- App-specific ---
spring.application.name=campus-byte
